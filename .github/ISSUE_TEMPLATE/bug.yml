name: Bug
description: Something is broken or wrong
title: 'fix: '
labels: ['type:fix']
assignees: [moudlajs]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong? Include the tool call or command, expected vs actual, and any error output.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Impact - which tool or league, and when (waivers, live games...).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist. Include the test expectation (unit / httptest fixture).
      value: |
        - [ ] 
        - [ ] Tests:
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, Sleeper endpoints and fields, design references.
