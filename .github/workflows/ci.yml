name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are the required status checks in the main ruleset.
# Renaming one here means updating the ruleset too.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: shellcheck
        run: shellcheck deploy/*.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Tests use httptest and testdata/ fixtures - never the real Sleeper API.
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -n 1

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath -o waiverwatch .

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=ci -t waiverwatch:ci .
      - name: container serves /health
        run: |
          docker run -d --name ww -p 8080:8080 -e WAIVERWATCH_USER=ci waiverwatch:ci
          for _ in $(seq 1 20); do
            curl -fsS localhost:8080/health && exit 0
            sleep 0.5
          done
          docker logs ww
          exit 1
