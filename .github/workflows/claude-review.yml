name: Claude review

on:
  pull_request:
    # `opened` is included so a PR opened straight as ready still gets a
    # review; drafts are filtered out by the job condition below.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# A new push cancels a review of the now-stale diff. Comment runs never
# cancel: workflow-level concurrency is evaluated before the job `if`, so a
# comment would otherwise kill a running review and then skip itself.
concurrency:
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Required status check. Skipped (= passing) for drafts, forks,
  # and release-please PRs so they never burn subscription quota.
  claude-review:
    name: claude-review
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Minted with `claude setup-token`: uses the Claude subscription,
          # not a metered API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Without these the review runs but has no permission to post, and
          # nothing ever appears on the PR. The read-only git/gh commands are
          # needed too: when a command is denied the review can give up and
          # still end "successfully" with no comment at all.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the working directory.

            Post your findings as GitHub comments - do not return them as a
            message, or nobody will see them:
              - `gh pr comment` for one overall summary
              - `mcp__github_inline_comment__create_inline_comment` with
                `confirmed: true` for a specific line

            Always finish by posting exactly one summary comment with
            `gh pr comment`, even if you find nothing.

            Review this pull request against CLAUDE.md and CONTRIBUTING.md.
            Read the linked issue (`gh issue view <N>`) and check the change
            meets its acceptance criteria and nothing beyond them. For the
            diff use `gh pr diff` or `git diff origin/main...HEAD`; skip
            binary files such as screenshots.

            Prioritise, in order:
            1. Correctness: Sleeper response mapping (missing, null or
               unexpected fields), the player-ID and owner joins, current
               season/week from /state/nfl (never hardcoded), league sizes
               10-32, context cancellation and timeouts, data races in the
               per-league fan-out, errors wrapped with context and never
               swallowed.
            2. Freshness: live data (rosters, matchups, trending) must never
               be cached; only the player dictionary may be, at most daily.
            3. Boundaries: internal/sleeper never imports internal/mcp; the
               mcp package never does HTTP; main.go is wiring only.
            4. Tests: new behaviour has table-driven tests; tests use
               httptest and testdata/ fixtures and never hit the real API.
            5. Security (when hosted): bearer auth on every MCP request,
               no secrets in logs or code, read-only against Sleeper.
            6. KISS: flag abstractions, dependencies, or config added ahead
               of need. Smaller is better.

            Be specific: file:line, a concrete failing scenario, and a
            suggested fix. If you find nothing significant, say so in one
            line instead of padding. Do not approve or merge.

      # The action silently skips, and so passes, when a PR changes this
      # workflow: it only trusts the version on main. A review that never
      # ran must not count as a passing one. See CONTRIBUTING.md.
      - name: Fail if the review did not run
        if: success() && steps.claude.outputs.execution_file == ''
        run: |
          echo "::error::Claude did not review this PR because it changes the review workflow. See CONTRIBUTING.md, 'Changing the review workflow'."
          exit 1

      # The action hides Claude's output, so a failed review (bad token,
      # usage limit, API error) shows no reason. Print just the result entry.
      - name: Show why the review failed
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq '.[] | select(.type == "result") | {subtype, is_error, result, errors}' "$EXECUTION_FILE"

  # `@claude` in a PR or issue comment, from the repo owner only.
  claude-mention:
    name: claude-mention
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
