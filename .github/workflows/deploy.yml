name: Deploy

# Builds a release tag's image and deploys it to Cloud Run. Called by
# release.yml when release-please publishes a release, or run by hand to
# (re)deploy any tag, e.g. to roll back.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v0.4.0
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no keys
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }} # every gcloud call below
      TAG: ${{ inputs.tag }}
      IMAGE: ${{ vars.GCP_IMAGE }}:${{ inputs.tag }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Only runs from main: the identity provider's condition rejects
      # tokens for any other ref.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg VERSION="$TAG" -t "$IMAGE" .
          docker push "$IMAGE"

      # Anyone signs in with their Sleeper username (docs/multi-user.md);
      # WAIVERWATCH_ALLOWED_USERS, when set, restricts who. The signing key
      # comes from Secret Manager at run time; this workflow never sees it.
      # Cost is capped by one instance, scale to zero, the app's rate
      # limits, the budget alert and the billing kill switch.
      - name: Deploy
        id: deploy
        env:
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          ALLOWED_USERS: ${{ vars.WAIVERWATCH_ALLOWED_USERS }}
          BASE_URL: ${{ vars.WAIVERWATCH_BASE_URL }}
        run: |
          # The connector URL: the repository variable, else this service's
          # current URL (Cloud Run URLs don't change between deploys).
          if [ -z "$BASE_URL" ]; then
            BASE_URL=$(gcloud run services describe waiverwatch --region "$REGION" --format 'value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the WAIVERWATCH_BASE_URL repository variable to the service URL (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          gcloud run deploy waiverwatch \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 256Mi \
            --concurrency 20 \
            --timeout 60 \
            --set-env-vars "^|^WAIVERWATCH_BASE_URL=$BASE_URL|WAIVERWATCH_ALLOWED_USERS=$ALLOWED_USERS" \
            --set-secrets "WAIVERWATCH_SIGNING_KEY=waiverwatch-signing-key:latest" \
            --quiet
          url=$(gcloud run services describe waiverwatch --region "$REGION" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TAG to $url/mcp" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          health=$(curl -fsS --retry 5 --retry-all-errors "$URL/health")
          echo "$health"
          test "$health" = "ok $TAG"
          # Signed out, /mcp must refuse with the challenge that starts sign-in.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp" -H 'Content-Type: application/json' -d '{}')
          test "$status" = 401
          # Discovery must name the URL the owner added in Claude.
          resource=$(curl -fsS "$URL/.well-known/oauth-protected-resource/mcp" | jq -r .resource)
          test "$resource" = "$BASE_URL/mcp"
