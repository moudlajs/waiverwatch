name: Assign

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    # One maintainer: issues not created through the forms get no assignee otherwise.
    if: github.event.issue.assignees[0] == null
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --repo "$REPO" --add-assignee "${{ github.repository_owner }}"
